name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install desktop build dependencies
        run: python -m pip install -e ".[desktop]"
      - name: Build Movie Compass
        shell: powershell
        env:
          MOVIE_COMPASS_SHARED_TMDB_KEY: ${{ secrets.TMDB_API_KEY }}
        run: .\build-desktop.ps1
      - name: Smoke-test packaged app
        shell: powershell
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "movie-compass-smoke"
          $env:MOVIE_COMPASS_SMOKE_TEST = "1"
          $process = Start-Process -FilePath ".\dist\MovieCompass\MovieCompass.exe" -PassThru -Wait
          $logPath = Join-Path $env:LOCALAPPDATA "MovieCompass\logs\startup.log"
          if (Test-Path -LiteralPath $logPath) { Get-Content -LiteralPath $logPath }
          if ($process.ExitCode -ne 0) { throw "Packaged Movie Compass failed its health check with exit code $($process.ExitCode)." }
      - uses: actions/upload-artifact@v4
        with:
          name: MovieCompass-Windows
          path: dist/MovieCompass-Windows.zip
          compression-level: 6
